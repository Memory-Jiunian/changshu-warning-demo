<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, sans-serif;
      }

      body {
        display: grid;
        gap: 8px;
        margin: 0;
        padding: 16px;
        color: var(--figma-color-text);
        background: var(--figma-color-bg);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 14px;
        line-height: 20px;
      }

      button {
        width: 100%;
        min-height: 32px;
        border: 0;
        border-radius: 6px;
        color: var(--figma-color-text-onbrand);
        background: var(--figma-color-bg-brand);
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <h1>Figma Design Compiler</h1>
    <button type="button" data-action="build-design-system">Build Design System</button>
    <button type="button" data-action="build-pilot-screen">Build Pilot Screen</button>
    <script>
      const buttons = [...document.querySelectorAll('button')];
      const labels = new Map(buttons.map((button) => [button.dataset.action, button.textContent]));

      buttons.forEach((button) => {
        button.addEventListener('click', () => {
          buttons.forEach((item) => {
            item.disabled = true;
          });
          button.textContent = 'Building...';
          parent.postMessage({ pluginMessage: { type: button.dataset.action } }, '*');
        });
      });

      onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (!message) return;

        buttons.forEach((button) => {
          button.disabled = false;
          button.textContent = labels.get(button.dataset.action);
        });
      };
    </script>
  </body>
</html>
