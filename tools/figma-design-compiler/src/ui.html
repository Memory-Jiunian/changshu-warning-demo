<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, sans-serif;
      }

      body {
        display: grid;
        gap: 8px;
        margin: 0;
        padding: 16px;
        color: var(--figma-color-text);
        background: var(--figma-color-bg);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 14px;
        line-height: 20px;
      }

      #schema-summary {
        margin: 0 0 4px;
        color: var(--figma-color-text-secondary);
        font-size: 11px;
        line-height: 16px;
      }

      #tasklify-summary {
        display: grid;
        gap: 2px;
        margin: 4px 0 8px;
        padding: 8px;
        border: 1px solid var(--figma-color-border);
        border-radius: 6px;
        color: var(--figma-color-text-secondary);
        font-size: 10px;
        line-height: 14px;
      }

      #tasklify-summary strong {
        color: var(--figma-color-text);
        font-size: 11px;
      }

      button {
        width: 100%;
        min-height: 32px;
        border: 0;
        border-radius: 6px;
        color: var(--figma-color-text-onbrand);
        background: var(--figma-color-bg-brand);
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <h1>Figma Design Compiler</h1>
    <p id="schema-summary">Loading bundled schema…</p>
    <button type="button" data-action="sync-design-system">Sync Design System</button>
    <button type="button" data-action="sync-pilot-screen">Sync Pilot Screen</button>
    <div id="tasklify-summary">
      <strong>Tasklify V2 Slice 01</strong>
      <span>Loading bundled package…</span>
    </div>
    <button type="button" data-action="sync-tasklify-slice01">
      Sync Tasklify V2 Slice 01
    </button>
    <script>
      const buttons = [...document.querySelectorAll('button')];
      const labels = new Map(buttons.map((button) => [button.dataset.action, button.textContent]));
      const schemaSummary = document.querySelector('#schema-summary');
      const tasklifySummary = document.querySelector('#tasklify-summary');

      parent.postMessage({ pluginMessage: { type: 'ui-ready' } }, '*');

      buttons.forEach((button) => {
        button.addEventListener('click', () => {
          buttons.forEach((item) => {
            item.disabled = true;
          });
          button.textContent = 'Building...';
          parent.postMessage({ pluginMessage: { type: button.dataset.action } }, '*');
        });
      });

      onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (!message) return;

        if (message.type === 'schema-summary') {
          schemaSummary.textContent =
            `Brand: ${message.summary.brand} · Radius: ${message.summary.radius}`;
          tasklifySummary.innerHTML = `
            <strong>Package: ${message.tasklify.name}</strong>
            <span>Schema: ${message.tasklify.schemaVersion} · Package: ${message.tasklify.packageVersion}</span>
            <span>Design System: ${message.tasklify.designSystemId}</span>
            <span>Desktop: ${message.tasklify.desktop} · Tablet: ${message.tasklify.tablet}</span>
          `;
          return;
        }

        buttons.forEach((button) => {
          button.disabled = false;
          button.textContent = labels.get(button.dataset.action);
        });
      };
    </script>
  </body>
</html>
